name: Preview original EH-UI on GitHub Pages
on:
  push:
    branches:
      - preview/original-atlas-mobile
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: original-eh-atlas-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set project Pages base URL
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));j.expo.experiments=j.expo.experiments||{};j.expo.experiments.baseUrl='/EH-UI';fs.writeFileSync(p,JSON.stringify(j,null,2))"
      - name: Install Expo dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Export original React Native Web app
        run: npx expo export --platform web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

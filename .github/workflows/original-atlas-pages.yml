name: Original EH-UI mobile preview
on:
  push:
    branches:
      - preview/original-component-atlas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install original Expo / React Native Web dependencies
        run: npm install --no-audit --no-fund
      - name: Configure GitHub Pages base path
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const json=JSON.parse(fs.readFileSync('app.json','utf8'));
          json.expo.experiments={...json.expo.experiments,baseUrl:'/EH-UI'};
          json.expo.web={...json.expo.web,output:'single'};
          fs.writeFileSync('app.json',JSON.stringify(json,null,2));
          NODE
      - name: Build unmodified source components with Expo
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web
      - name: Create deep link fallback for mobile
        run: |
          test -f dist/index.html
          mkdir -p dist/original-atlas
          cp dist/index.html dist/original-atlas/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Build standalone original-components HTML for raw.githack preview
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          mv dist dist-pages
          node - <<'NODE'
          const fs=require('node:fs');
          const filename='app.json';
          const app=JSON.parse(fs.readFileSync(filename,'utf8'));
          app.expo.experiments={...app.expo.experiments,baseUrl:'/yorixiro/EH-UI/gh-pages/direct'};
          fs.writeFileSync(filename,JSON.stringify(app,null,2));
          NODE
          npx expo export --platform web
          mkdir -p dist-pages/direct
          cp -a dist/. dist-pages/direct/
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('dist/index.html','utf8');
          const fix='<script>history.replaceState(null,"","/yorixiro/EH-UI/gh-pages/direct/original-atlas");</script>';
          fs.writeFileSync('dist-pages/direct/original-atlas.html',html.replace('</head>',fix+'</head>'));
          NODE
          rm -rf dist
          mv dist-pages dist
      - name: Publish built web assets to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
